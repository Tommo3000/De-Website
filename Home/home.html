<!DOCTYPE html>
<html>
<head>
    <title>Start! - Brandend Huis</title>
    <meta charset="UTF-8"/>
    <script>
        document.write(`
            <link rel="stylesheet" href="/index.css">
        `);
    </script>
</head>
<body>
    <script>
        fetch('../index.html')
            .then(response => response.text())
            .then(html => {
                document.body.innerHTML = html;
                return fetch('home_content.html');
            })
            .then(response => response.text())
            .then(component => {
                document.getElementById('content').innerHTML = component;
            });
    </script>
</body>
</html>
